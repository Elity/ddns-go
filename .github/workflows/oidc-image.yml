name: OIDC image
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oidc-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./web ./config
      - run: go vet ./...
      - run: node --test web/oidc_ui_test.mjs
      - name: Verify original Dockerfile build context
        run: |
          CGO_ENABLED=0 go build -o ddns-go .
          cp -R /usr/share/zoneinfo zoneinfo
          docker build -f Dockerfile -t ddns-go:legacy-smoke .
  publish:
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.oidc
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=v6.17.7-oidc-${{ github.sha }}
          tags: |
            ghcr.io/elity/ddns-go:oidc
            ghcr.io/elity/ddns-go:oidc-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
