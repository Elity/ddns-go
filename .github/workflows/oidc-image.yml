name: OIDC image
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: oidc-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./web ./config
      - run: go vet ./...
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.oidc
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=v6.17.7-oidc-${{ github.sha }}
          tags: |
            ghcr.io/elity/ddns-go:oidc
            ghcr.io/elity/ddns-go:oidc-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
